version: '3.8'

services:
  course-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course-service
    ports:
      - "8082:8080"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    networks:
      - soa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/course-service/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  soa-network:
    driver: bridge